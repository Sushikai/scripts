<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e0a1a">
  <title>flow — 视频生产平台</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ad5'/%3E%3Cstop offset='1' stop-color='%236e7bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath fill='%23fff' d='M11 9l8 7-8 7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/views.css">
  <style>
    /* 防闪烁:主题同步脚本必须早于任何渲染 */
    html { visibility: hidden; }
    html.theme-ready { visibility: visible; }
  </style>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('flow-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      requestAnimationFrame(function() { document.documentElement.classList.add('theme-ready'); });
    })();
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="hamburger" id="hamburger" aria-label="菜单">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M3 12h18M3 18h18"/>
      </svg>
    </button>
    <a class="brand" href="#dashboard">
      <span class="brand-icon">▶</span>
      <span class="brand-name">flow</span>
      <span class="brand-sub">视频生产</span>
    </a>
    <div class="topbar-spacer"></div>
    <button class="topbar-btn" id="theme-toggle" aria-label="切换主题">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
    <span class="conn-light" id="conn-light" title="连接状态"></span>
  </header>

  <aside class="drawer" id="drawer">
    <nav class="drawer-nav">
      <a href="#dashboard" class="drawer-link">📊 Dashboard</a>
      <a href="#new" class="drawer-link">✨ 新建项目</a>
      <a href="#projects" class="drawer-link">📦 项目列表</a>
      <a href="#library" class="drawer-link">🎬 素材库</a>
      <a href="#accounts" class="drawer-link">👤 账号管理</a>
      <a href="#uploads" class="drawer-link">📤 上传记录</a>
      <a href="#logs" class="drawer-link">📋 日志</a>
      <a href="#settings" class="drawer-link">⚙️ 设置</a>
    </nav>
    <div class="drawer-footer">
      <span class="drawer-meta">flow v0.1.0 · :8810</span>
    </div>
  </aside>

  <main class="app-main" id="app-main">
    <div class="view-host" id="view-host">
      <div class="flow-skeleton view-skeleton" style="height: 60vh;"></div>
    </div>
  </main>

  <div class="toast-host" id="toast-host"></div>

  <script src="/static/js/core.js"></script>
  <script src="/static/js/view-dashboard.js"></script>
  <script src="/static/js/view-project-new.js"></script>
  <script src="/static/js/view-projects.js"></script>
  <script src="/static/js/view-project-detail.js"></script>
  <script src="/static/js/view-library.js"></script>
  <script src="/static/js/view-accounts.js"></script>
  <script src="/static/js/view-uploads.js"></script>
  <script src="/static/js/view-logs.js"></script>
  <script src="/static/js/view-settings.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(function() {});
    }
  </script>

  <style>
    /* 局部样式,等组件化后再拆 */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
      padding: 0 var(--sp-6);
      display: flex; align-items: center; gap: var(--sp-4);
      background: var(--bg-elev);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 100;
    }
    .topbar-spacer { flex: 1; }
    .hamburger { color: var(--ink-2); padding: var(--sp-3); border-radius: var(--r-md); }
    .hamburger:hover { background: var(--bg-elev-2); color: var(--ink-1); }
    .brand { display: flex; align-items: center; gap: var(--sp-3); color: var(--ink-1); }
    .brand:hover { text-decoration: none; }
    .brand-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: var(--brand-grad); color: var(--ink-on-brand);
      border-radius: var(--r-sm); font-size: 12px;
    }
    .brand-name { font-weight: 700; font-size: var(--fs-lg); letter-spacing: .02em; }
    .brand-sub { color: var(--ink-3); font-size: var(--fs-sm); margin-left: var(--sp-2); }
    .topbar-btn { color: var(--ink-2); padding: var(--sp-3); border-radius: var(--r-md); }
    .topbar-btn:hover { color: var(--ink-1); background: var(--bg-elev-2); }
    .conn-light {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ink-4); margin-left: var(--sp-4);
      transition: var(--t-fast);
    }
    .conn-light.ok { background: var(--ok); box-shadow: 0 0 8px rgba(76,217,123,.6); }
    .conn-light.err { background: var(--err); }

    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 240px;
      background: var(--bg-1);
      border-right: 1px solid var(--line);
      padding: calc(var(--topbar-h) + env(safe-area-inset-top, 0px) + var(--sp-4)) var(--sp-5) var(--sp-5);
      transform: translateX(-100%);
      transition: transform var(--t-mid);
      z-index: 90;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-nav { display: flex; flex-direction: column; gap: var(--sp-2); }
    .drawer-link {
      display: block; padding: var(--sp-3) var(--sp-5);
      border-radius: var(--r-md); color: var(--ink-2);
      font-size: var(--fs-md);
    }
    .drawer-link:hover { background: var(--bg-elev); color: var(--ink-1); text-decoration: none; }
    .drawer-link.active { background: var(--brand-grad-soft); color: var(--ink-1); font-weight: 600; }
    .drawer-footer { margin-top: auto; padding-top: var(--sp-5); border-top: 1px solid var(--line); }
    .drawer-meta { color: var(--ink-4); font-size: var(--fs-xs); font-family: var(--font-mono); }

    .app-main {
      padding-top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
      padding-left: var(--sp-6); padding-right: var(--sp-6); padding-bottom: var(--sp-8);
      min-height: 100vh;
      transition: margin-left var(--t-mid);
    }
    /* drawer 打开时,desktop 把主内容右移避免被 drawer 拦截点击 */
    @media (min-width: 769px) {
      body.drawer-open .app-main { margin-left: 240px; }
    }
    @media (max-width: 768px) {
      .app-main { padding-left: var(--sp-4); padding-right: var(--sp-4); }
      .drawer { width: 200px; }
      /* 移动端 drawer 全屏 overlay,主内容不移动 */
      body.drawer-open .app-main { margin-left: 0; }
      body.drawer-open::after {
        content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.4);
        z-index: 89;
      }
    }

    .toast-host {
      position: fixed; bottom: var(--sp-7); right: var(--sp-7);
      z-index: 200; display: flex; flex-direction: column; gap: var(--sp-3);
      max-width: 320px;
    }
    .toast {
      background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: var(--sp-4) var(--sp-5); color: var(--ink-1); font-size: var(--fs-sm);
      box-shadow: var(--shadow-2);
      animation: toast-in var(--t-mid);
    }
    .toast.err { border-color: var(--err); }
    .toast.ok { border-color: var(--ok); }
    @keyframes toast-in {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .view-host { padding: var(--sp-4) 0; }
    .view-skeleton { width: 100%; max-width: 600px; height: 40vh; }

    @media (min-width: 769px) {
      body { padding-left: 0; }
    }
  </style>
</body>
</html>
